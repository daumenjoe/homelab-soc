<text x="485.0" y="162.0" font-size="10.5" fill="#8b949e" text-anchor="middle">agent · eve.json + kismet json</text>
<line x1="310" y1="244.0" x2="660" y2="240" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="485.0" y="235.0" font-size="10.5" fill="#8b949e" text-anchor="middle">agent · opencanary log</text>
<line x1="310" y1="320.0" x2="660" y2="310" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="485.0" y="308.0" font-size="10.5" fill="#8b949e" text-anchor="middle">agent · monitor json</text>
<line x1="310" y1="396.0" x2="660" y2="380" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="485.0" y="381.0" font-size="10.5" fill="#8b949e" text-anchor="middle">agent · audit.log, syscheck, journald</text>
<line x1="310" y1="472.0" x2="430" y2="574.0" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="370.0" y="515.0" font-size="10.5" fill="#8b949e" text-anchor="middle">velociraptor client</text>
<line x1="620" y1="552" x2="710" y2="504" stroke="#58a6ff" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="628" y="574" font-size="10.5" fill="#8b949e" text-anchor="start">agent · json localfile</text>
<rect x="960" y="60" width="320" height="64" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text x="972" y="78" font-size="13" font-weight="600" fill="#e6edf3">DFIR-IRIS  ·  case management</text>
<text x="972" y="93" font-size="11.5" fill="#8b949e">one case per alert, tags dm-* / llm-*</text>
<text x="972" y="108" font-size="11.5" fill="#8b949e">enrichment and triage text attached</text>
<rect x="960" y="150" width="320" height="230" rx="6" fill="#3b2e00" stroke="#d29922" stroke-width="1.2"/>
<text x="972" y="168" font-size="13" font-weight="600" fill="#e6edf3">custom-iris v2.9  ·  enrichment + triage</text>
<circle cx="982" cy="188" r="9" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
<text x="982" y="192" font-size="10.5" font-weight="600" text-anchor="middle" fill="#e6edf3">1</text>
<text x="1000" y="192" font-size="12" font-weight="600" fill="#e6edf3">RDAP</text>
<text x="1100" y="192" font-size="11" fill="#8b949e">domain age</text>
<circle cx="982" cy="218" r="9" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
<text x="982" y="222" font-size="10.5" font-weight="600" text-anchor="middle" fill="#e6edf3">2</text>
<text x="1000" y="222" font-size="12" font-weight="600" fill="#e6edf3">VirusTotal</text>
<text x="1100" y="222" font-size="11" fill="#8b949e">quota-limited, cached</text>
<circle cx="982" cy="248" r="9" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
<text x="982" y="252" font-size="10.5" font-weight="600" text-anchor="middle" fill="#e6edf3">3</text>
<text x="1000" y="252" font-size="12" font-weight="600" fill="#e6edf3">MISP</text>
<text x="1100" y="252" font-size="11" fill="#8b949e">restSearch + feed cache, decay</text>
<circle cx="982" cy="278" r="9" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
<text x="982" y="282" font-size="10.5" font-weight="600" text-anchor="middle" fill="#e6edf3">4</text>
<text x="1000" y="282" font-size="12" font-weight="600" fill="#e6edf3">nimble</text>
<text x="1100" y="282" font-size="11" fill="#8b949e">decision model, gate 0.5</text>
<circle cx="982" cy="308" r="9" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
<text x="982" y="312" font-size="10.5" font-weight="600" text-anchor="middle" fill="#e6edf3">5</text>
<text x="1000" y="312" font-size="12" font-weight="600" fill="#e6edf3">Gemma 4 12B</text>
<text x="1100" y="312" font-size="11" fill="#8b949e">triage if needs_human ≥ 0.5</text>
<circle cx="982" cy="338" r="9" fill="#0d1117" stroke="#d29922" stroke-width="1.2"/>
<text x="982" y="342" font-size="10.5" font-weight="600" text-anchor="middle" fill="#e6edf3">6</text>
<text x="1000" y="342" font-size="12" font-weight="600" fill="#e6edf3">gpt-oss 20B</text>
<text x="1100" y="342" font-size="11" fill="#8b949e">second opinion → llm-disagree</text>
<text x="972" y="370" font-size="10.5" fill="#8b949e">Ollama on a separate PC, port 11434 only for the manager</text>
<rect x="960" y="410" width="320" height="64" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text x="972" y="428" font-size="13" font-weight="600" fill="#e6edf3">Grafana + Prometheus  ·  LXC</text>
<text x="972" y="443" font-size="11.5" fill="#8b949e">Wazuh Alerts dashboard (OpenSearch, read-only)</text>
<text x="972" y="458" font-size="11.5" fill="#8b949e">node / pihole / fritzbox exporters on 13 hosts</text>
<rect x="960" y="500" width="320" height="64" rx="6" fill="#161b22" stroke="#6e7681" stroke-width="1.2"/>
<text x="972" y="518" font-size="13" font-weight="600" fill="#e6edf3">Watchdog  ·  Pi 3</text>
<text x="972" y="533" font-size="11.5" fill="#8b949e">14 checks: services, backups, NIC, alert volume</text>
<text x="972" y="548" font-size="11.5" fill="#8b949e">ntfy push on state change, outside the stack</text>
<line x1="880" y1="290" x2="960" y2="210" stroke="#d29922" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="886" y="306" font-size="10.5" fill="#8b949e" text-anchor="start">level ≥ 7</text>
<line x1="1110" y1="150" x2="1110" y2="124" stroke="#d29922" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="1118" y="140" font-size="10.5" fill="#8b949e" text-anchor="start">case + tags</text>
<line x1="880" y1="460" x2="960" y2="442" stroke="#6e7681" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="884" y="476" font-size="10.5" fill="#8b949e" text-anchor="start">OpenSearch</text>
<line x1="960" y1="532" x2="880" y2="492" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="952" y="548" font-size="10.5" fill="#8b949e" text-anchor="end">HTTP / TCP checks</text>
<text x="20" y="672" font-size="10.5" fill="#8b949e">Proxmox PVE 9 on a Lenovo M90q (i5-10500, 32 GB) hosts the VMs and LXCs; Pis, the LLM PC and the switch mirror port are separate hardware. All hosts are in Wazuh, Velociraptor and Prometheus.</text>
