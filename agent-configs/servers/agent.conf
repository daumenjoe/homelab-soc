  <agent_config name="iris">
    <wodle name="docker-listener">
      <disabled>no</disabled>
      <interval>10m</interval>
      <attempts>5</attempts>
      <run_on_start>yes</run_on_start>
    </wodle>
  </agent_config>
  <agent_config name="misp">
    <wodle name="docker-listener">
      <disabled>no</disabled>
      <interval>10m</interval>
      <attempts>5</attempts>
      <run_on_start>yes</run_on_start>
    </wodle>
  </agent_config>
  <agent_config name="relay">
    <localfile>
      <log_format>json</log_format>
      <location>/var/log/fritz/fritz.log</location>
    </localfile>
  </agent_config>
  <agent_config name="llm">
    <localfile>
      <log_format>json</log_format>
      <location>/var/log/hw-metrics/hw-metrics.log</location>
    </localfile>
  </agent_config>
  <agent_config name="velociraptor">
    <localfile>
      <log_format>json</log_format>
      <location>/var/lib/velociraptor/clients/*/monitoring/Homelab.Events.Baseline/Listeners/*.json</location>
      <label key="vr_source">homelab_baseline</label>
    </localfile>
    <localfile>
      <log_format>json</log_format>
      <location>/var/lib/velociraptor/clients/*/monitoring/Homelab.Events.Baseline/AuthorizedKeys/*.json</location>
      <label key="vr_source">homelab_baseline</label>
    </localfile>
    <localfile>
      <log_format>json</log_format>
      <location>/var/lib/velociraptor/clients/*/monitoring/Homelab.Events.Baseline/Cron/*.json</location>
      <label key="vr_source">homelab_baseline</label>
    </localfile>
    <localfile>
      <log_format>json</log_format>
      <location>/var/lib/velociraptor/clients/*/monitoring/Homelab.Events.FirewallState/Chains/*.json</location>
      <label key="vr_source">homelab_firewallstate</label>
    </localfile>
  </agent_config>
